name: Deploy Cloudflare API (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: elemental-api-production
  cancel-in-progress: false
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tests
        run: npm test && python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Apply database migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm run db:migrate
          npm run deploy:api
